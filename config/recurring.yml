# Recurring tasks for Solid Queue. See https://github.com/rails/solid_queue
#
# The Terra Nova API is poll-based (15-30s recommended). `Demands::SyncJob`
# upserts demands by their stable `request_code`, so polling is idempotent.
development:
  demand_sync:
    class: Demands::SyncJob
    queue: default
    schedule: every 30 seconds

  appointment_reminders:
    class: Appointments::ReminderJob
    queue: default
    schedule: every 10 minutes

production:
  demand_sync:
    class: Demands::SyncJob
    queue: default
    schedule: every 30 seconds

  appointment_reminders:
    class: Appointments::ReminderJob
    queue: default
    schedule: every hour at minute 5

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
