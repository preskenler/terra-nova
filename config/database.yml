# MySQL. Versions 8.0 and up are supported.
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
# Connection details can be provided through environment variables, which is how
# the docker-compose development stack connects to the `db` service.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("MYSQL_USER", "rails") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD", "password") %>
  host: <%= ENV.fetch("MYSQL_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("MYSQL_PORT", 3306) %>

development:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE", "terra_nova_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("MYSQL_TEST_DATABASE", "terra_nova_test") %>

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("MYSQL_DATABASE", "terra_nova_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("MYSQL_CACHE_DATABASE", "terra_nova_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("MYSQL_QUEUE_DATABASE", "terra_nova_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("MYSQL_CABLE_DATABASE", "terra_nova_production_cable") %>
    migrations_paths: db/cable_migrate
