# PostgreSQL. Versions 16 and up are supported (targeting PostgreSQL 18.6).
#
#   gem install pg
#
# Connection details can be provided through environment variables, which is how
# the docker-compose development stack connects to the `db` service.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "rails") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "password") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE", "terra_nova_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DATABASE", "terra_nova_test") %>

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
#
# The cache, queue and cable connections fall back to the primary database
# when their dedicated variables are unset; set POSTGRES_CACHE_DATABASE,
# POSTGRES_QUEUE_DATABASE and POSTGRES_CABLE_DATABASE to split them onto their
# own databases.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DATABASE", "terra_nova_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CACHE_DATABASE") { ENV.fetch("POSTGRES_DATABASE", "terra_nova_production") } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_QUEUE_DATABASE") { ENV.fetch("POSTGRES_DATABASE", "terra_nova_production") } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CABLE_DATABASE") { ENV.fetch("POSTGRES_DATABASE", "terra_nova_production") } %>
    migrations_paths: db/cable_migrate
