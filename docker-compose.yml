services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-terra_nova_development}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-terra_nova_test}
      MYSQL_USER: ${MYSQL_USER:-rails}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      target: development
    command: bash -c "./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-terra_nova_development}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-terra_nova_test}
      MYSQL_USER: ${MYSQL_USER:-rails}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
