services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-terra_nova_development}
      MYSQL_USER: ${DB_USERNAME:-rails}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-terra_nova_test}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-rails} -p${DB_PASSWORD:-password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      target: development
    command: bash -c "./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-terra_nova_development}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-terra_nova_test}
      DB_USERNAME: ${DB_USERNAME:-rails}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
